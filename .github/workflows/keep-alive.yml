name: Keep Space Awake

# Free Hugging Face Spaces sleep after ~48h without traffic, and a sleeping
# Space cold-starts on the first visitor — which, for a portfolio demo, means
# the reviewer sees a spinner instead of the app. A health ping every 6h keeps
# it warm and doubles as uptime monitoring.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Space
        run: |
          URL="https://ayush707-rag-backend.hf.space/health"

          # A sleeping Space has to boot before it can answer, so retry rather
          # than judging it dead on the first timeout.
          for i in $(seq 1 10); do
            body=$(curl -fsS --max-time 60 "$URL" 2>/dev/null || true)
            case "$body" in
              *'"status":"ok"'*)
                echo "Healthy: $body"
                exit 0 ;;
              *'"status":"degraded"'*)
                # Awake, but it cannot reach Qdrant — worth surfacing, since
                # retrieval is broken even though the process is up.
                echo "::warning::Space is up but degraded: $body"
                exit 0 ;;
            esac
            echo "  [$i/10] waking up..."
            sleep 30
          done

          echo "::error::Space did not respond healthy after ~5 minutes."
          exit 1
