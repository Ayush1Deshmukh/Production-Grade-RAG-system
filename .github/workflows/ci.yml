name: CI — RAG Evaluation Gate

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─── Job 1: Unit Tests ───────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        env:
          # Unit tests mock external services. These are the only keys still
          # marked required in app/config.py — Settings() raises at import time
          # without them and every test fails.
          CEREBRAS_API_KEY: "dummy"
          QDRANT_URL: "http://localhost:6333"
          QDRANT_API_KEY: "dummy"
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  # ─── Job 2: Docker Build ─────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build ./backend -t rag-backend:${{ github.sha }}

      - name: Confirm Image Health
        run: |
          echo "Docker image built successfully: rag-backend:${{ github.sha }}"

  # ─── Job 3: Ragas Evaluation Gate ─────────────────────────────────────────
  ragas-evaluation:
    name: Ragas Evaluation Gate
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only run on pushes to main to save API quota
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ragas Evaluation (Faithfulness Gate > 90%)
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          LLM_MODEL: gpt-oss-120b
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""
        run: |
          cd backend
          python ../evaluation/run_evaluation.py

      - name: Upload Evaluation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: evaluation/eval_results.json
          retention-days: 30

  # ─── Job 4: Deploy (on main pass) ────────────────────────────────────────────
  deploy:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    needs: [docker-build, ragas-evaluation]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://ayushdeshmukh:$HF_TOKEN@huggingface.co/spaces/ayushdeshmukh/rag-backend
          git push --force space main
